name: Universal build

# Every push to main builds the universal (Apple Silicon + Intel) app and
# publishes the DMG as a GitHub release, so it can be downloaded from Releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build (arm64 + x86_64)
        run: ./build.sh

      - name: Check both architectures
        run: lipo build/stage/Vorssaint.app/Contents/MacOS/Vorssaint -verify_arch arm64 x86_64

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      # Downloadable from the run page even if publishing the release fails.
      - uses: actions/upload-artifact@v4
        with:
          name: Vorssaint-universal
          path: dist/*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.dmg \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Universal build $GITHUB_RUN_NUMBER" \
            --notes "Universal (Apple Silicon + Intel) build of ${GITHUB_SHA::7}. Not notarized: after the first launch, allow it in System Settings → Privacy & Security → Open Anyway."
